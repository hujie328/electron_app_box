<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron App Box WebSocket 示例</title>
</head>

<body>
    <h1>Electron-Box</h1>

    <script>
        /**
         * WebSocketClient 用于演示普通浏览器页面如何连接本地 WebSocket 服务。
         *
         * 注意：Electron 应用正式页面通常通过 preload 暴露的 window.AppFns 接收主进程转发消息；
         * 这个根目录 index.html 更像独立调试页，不是 runtime 默认加载的入口。
         */
        class WebSocketClient {
            /**
             * @param {string} url WebSocket 服务地址，例如 ws://127.0.0.1:50080/wskoa1
             * @param {object} options 可选配置，用于覆盖重连间隔和心跳间隔
             */
            constructor(url, options = {}) {
                this.url = url
                this.options = options
                this.socket = null
                this.reconnectTimer = null
                this.heartbeatTimer = null
                this.reconnectInterval = options.reconnectInterval || 5000
                this.heartbeatInterval = options.heartbeatInterval || 10000
                this.isReconnecting = false

                this.connect()
            }

            /** 创建新的 WebSocket 连接，并绑定连接、消息、异常、关闭事件。 */
            connect() {
                this.socket = new WebSocket(this.url)
                this.bindEvents()
            }

            /**
             * 绑定 WebSocket 生命周期事件。
             *
             * 这里使用属性赋值而不是 addEventListener，是因为每次重连都会创建新的 socket 实例，
             * 旧实例关闭后不会继续复用事件处理器。
             */
            bindEvents() {
                this.socket.onopen = () => {
                    console.log('WebSocket 连接已打开')
                    this.startHeartbeat()
                }

                this.socket.onmessage = (event) => {
                    console.log(`接收到消息: ${event.data}`)
                }

                this.socket.onerror = (error) => {
                    console.error('WebSocket 发生错误:', error)
                    this.handleDisconnect()
                }

                this.socket.onclose = (event) => {
                    console.log('WebSocket 连接已关闭:', event.code, event.reason)
                    this.handleDisconnect()
                }
            }

            /** 启动心跳，定时向服务端发送 heartbeat，避免长时间空闲连接被代理或系统回收。 */
            startHeartbeat() {
                clearInterval(this.heartbeatTimer)
                this.heartbeatTimer = setInterval(() => {
                    if (this.socket.readyState === WebSocket.OPEN) {
                        this.socket.send('heartbeat')
                    }
                }, this.heartbeatInterval)
            }

            /** 处理断线重连；isReconnecting 防止 error 和 close 同时触发时创建多个重连定时器。 */
            handleDisconnect() {
                clearInterval(this.heartbeatTimer)

                if (this.isReconnecting) return

                this.isReconnecting = true
                this.reconnectTimer = setTimeout(() => {
                    this.connect()
                    this.isReconnecting = false
                }, this.reconnectInterval)
            }

            /** 发送业务消息；连接未打开时直接提示，避免浏览器抛出 InvalidStateError。 */
            send(data) {
                if (this.socket.readyState === WebSocket.OPEN) {
                    this.socket.send(data)
                    return
                }

                console.error('WebSocket 连接未打开，无法发送数据')
            }

            /** 主动关闭连接并清理定时器。 */
            close() {
                clearTimeout(this.reconnectTimer)
                clearInterval(this.heartbeatTimer)
                this.socket?.close()
            }
        }

        // 独立调试示例：先启动 Electron 应用，再用浏览器打开这个页面进行 WS 连接测试。
        const demoSocket = new WebSocketClient('ws://127.0.0.1:50080/wskoa1')

        // 如需手动关闭连接，可在控制台执行 demoSocket.close()。
        window.demoSocket = demoSocket
    </script>
</body>

</html>
